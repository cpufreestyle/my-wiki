name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 测试 (reminder_web + RAG)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装单测第三方依赖（只有 Pillow）
        # 单元测试步骤在 requirements.txt 之前跑，全套用例只允许标准库 + 仓库内一方
        # 模块；目前唯一的例外是 tests/test_face_mood_web.py 的人像抠图尺寸用例要用
        # Pillow。不装整份 requirements.txt —— opencv / mediapipe 会让 CI 多下载几百
        # MB。用例新增第三方 import 时，同步补这一行（tests/test_ci_dependency_contract.py
        # 会在本地就把漏改抓出来）。
        run: python -m pip install Pillow

      - name: Python 单元测试（tests/run_all.py 全套模块）
        run: python tests/run_all.py

      - name: Node 单元测试（reminder_web 纯日期逻辑）
        run: node --test "tests/**/*.test.mjs"

      - name: 安装桌面端依赖（PySide6）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libdbus-1-3
          python -m pip install --upgrade pip
          python -m pip install PySide6

      - name: 桌面端启动冒烟（PySide6, offscreen 无头）
        run: |
          export QT_QPA_PLATFORM=offscreen
          python scripts/smoke_desktop_qt.py

      - name: RAG 引擎冒烟测试（BM25，零依赖）
        run: python rag.py "本地模型 ollama 配置" --limit 3

      - name: theme.py 导入检查
        run: python -c "import theme; assert theme.LIGHT and theme.DARK; print('theme OK')"
