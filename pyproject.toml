[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mywiki"
version = "2.10.1"
description = "MyWiki — 个人知识管理工具集（日记、心情、提醒、语义检索、桌面 GUI）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Michael Qiu" },
]

dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "Pillow>=9.0.0",
    "feedparser>=6.0.0",
    "PySide6>=6.5.0",
    'pyobjc-framework-Vision>=10.0; sys_platform == "darwin"',
    'pyobjc-framework-Quartz>=10.0; sys_platform == "darwin"',
]

# 可选依赖（对应功能未安装时自动降级）：
#   SpeechRecognition  语音识别（voice_mood.py）
#   watchdog           Obsidian 文件监听（obsidian_bridge.py）
#   static-ffmpeg      ffmpeg 自动分发（voice_mood.py）
#   mcp                MCP 协议完整支持（mcp_server.py 可降级为 JSON-RPC stdio）
#   mistune            高级 Markdown 处理

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "playwright",
]

[project.scripts]
# CLI 入口 —— 替代 python wiki_tool.py <command>
mywiki = "wiki_tool:main"

[project.gui-scripts]
# 桌面 GUI 入口
mywiki-app = "wiki_app:main"
# 本地 Web 服务器
mywiki-server = "web_server:main"

[tool.setuptools]
# 根目录单文件模块（不迁移到子包时，显式列出）
py-modules = [
    "backup_snapshots",
    "rag",
    "reminder_manager",
    "reminder_ui",
    "send_reminder",
    "theme",
    "vision_segment",
    "voice_mood",
    "web_server",
    "wiki_app",
    "wiki_data",
    "wiki_i18n",
    "wiki_paths",
    "wiki_tabs_daily",
    "wiki_tabs_mood",
    "wiki_tabs_reminder",
    "wiki_tabs_share",
    "wiki_theme",
    "wiki_tool",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
